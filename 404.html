<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#25324b">
  <title>Page Not Found — Reviewer SEO Tools</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.error-box{max-width:680px;width:100%;padding:40px 24px;border-radius:20px}.error-code{font-size:clamp(4rem,15vw,8rem);line-height:1;font-weight:800;margin:0 0 12px}.error-box h1{margin:0 0 12px}.error-box p{margin:0 auto 24px;max-width:560px}.error-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.error-actions a{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:10px;text-decoration:none}
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-box" aria-labelledby="error-title">
      <p class="error-code" aria-hidden="true">404</p>
      <h1 id="error-title">Page not found</h1>
      <p>The page you requested does not exist or may have moved. Return to Reviewer SEO Tools or open the SEO guide.</p>
      <div class="error-actions">
        <a href="/">Go to homepage</a>
        <a href="/pages/guide.html">Open SEO guide</a>
      </div>
    </section>
  </main>
</body>
</html>
